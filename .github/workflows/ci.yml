name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Test
        run: go test -race ./...

  web:
    name: Web (format, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run check:i18n
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  binary:
    name: Binary (embedded web app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build the web app and the binary
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run build
          go build -o osfm ./cmd/osfm

      - name: Start the binary and check what it serves
        run: |
          data="$(mktemp -d)"
          ./osfm serve --dir "$data" --http 127.0.0.1:8090 >"$data/log.txt" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8090/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          set -e
          curl -fsS http://127.0.0.1:8090/api/health
          echo
          # The built app, not the placeholder page: Vite's output references its assets directory.
          curl -fsS http://127.0.0.1:8090/ | grep -q '/assets/index-'
          # Client-side routes fall back to index.html.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/some/client/route)" = 200
          # The PWA files: the manifest, the service worker and its registration script, the icons.
          curl -fsS http://127.0.0.1:8090/manifest.webmanifest | grep -q '"start_url":"/"'
          curl -fsS http://127.0.0.1:8090/sw.js | grep -q 'precacheAndRoute'
          curl -fsS http://127.0.0.1:8090/ | grep -q 'src="/registerSW.js"'
          for icon in pwa-192x192.png pwa-512x512.png maskable-icon-512x512.png apple-touch-icon-180x180.png; do
            curl -fsS -o /dev/null "http://127.0.0.1:8090/$icon"
          done
          # The map: its glyphs and sprites, MapLibre's worker as JavaScript (a module worker needs a script type),
          # and the city index (empty without tile files).
          curl -fsS -o /dev/null 'http://127.0.0.1:8090/map/fonts/Noto%20Sans%20Regular/0-255.pbf'
          curl -fsS http://127.0.0.1:8090/map/sprites/light.json | grep -q '"width"'
          worker="$(cd web/dist/app && ls assets/maplibre-gl-worker-*.mjs)"
          curl -fsS -o /dev/null -w '%{content_type}' "http://127.0.0.1:8090/$worker" | grep -q '^text/javascript'
          test "$(curl -fsS http://127.0.0.1:8090/tiles/)" = '{"cities":[]}'
          # The instance metadata: public JSON with the instance key and the version the binary reports.
          ./osfm --version
          version="$(./osfm --version | sed 's/.* version //')"
          test "$(curl -s -o /dev/null -w '%{content_type}' http://127.0.0.1:8090/.well-known/osfm.json)" = application/json
          curl -fsS http://127.0.0.1:8090/.well-known/osfm.json | tee /dev/stderr | grep -Fq "\"softwareVersion\":\"$version\""
          curl -fsS http://127.0.0.1:8090/.well-known/osfm.json | grep -q '"publicKey":{"kty":"OKP","crv":"Ed25519","x":"[A-Za-z0-9_-]\{43\}"}'
          echo "The binary serves the embedded web app."

  docker:
    name: Docker (amd64, arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Compiling never needs emulation (deploy/Dockerfile cross-compiles); QEMU is for running the arm64 image below.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      # The same build as the release workflow, without pushing.
      - name: Build for both platforms
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          # A fixed version, so that the image reports something to check below (a release passes its tag).
          build-args: |
            VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker's image store cannot load a multi-platform build in one go; load each platform from the builder's cache.
      - name: Load the amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          build-args: |
            VERSION=0.0.0-ci
          tags: osfm:ci-amd64

      - name: Load the arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          load: true
          provenance: false
          build-args: |
            VERSION=0.0.0-ci
          tags: osfm:ci-arm64

      - name: Image sizes
        run: |
          for arch in amd64 arm64; do
            size="$(docker image inspect --format '{{.Size}}' "osfm:ci-$arch")"
            line="osfm:ci-$arch ($(docker image inspect --format '{{.Os}}/{{.Architecture}}' "osfm:ci-$arch")): $((size / 1024 / 1024)) MiB ($size bytes)"
            echo "$line"
            echo "- $line" >>"$GITHUB_STEP_SUMMARY"
          done

      - name: Run each image and check what it serves
        run: |
          set -eu
          check() {
            arch="$1" port="$2"
            name="osfm-ci-$arch"
            # A named volume, as in the README: it starts with the image's /data, owned by the non-root user.
            docker volume create "$name" >/dev/null
            docker run -d --name "$name" --platform "linux/$arch" -p "127.0.0.1:$port:8090" -v "$name:/data" "osfm:ci-$arch"
            # PocketBase starts slowly under emulation.
            ok=0
            for _ in $(seq 1 90); do
              if curl -fsS "http://127.0.0.1:$port/api/health" >/dev/null 2>&1; then ok=1; break; fi
              sleep 1
            done
            if [ "$ok" -ne 1 ]; then
              echo "linux/$arch: /api/health did not answer" >&2
              docker logs "$name" >&2 || true
              return 1
            fi
            curl -fsS "http://127.0.0.1:$port/api/health"
            echo
            # The built app, not the placeholder page: Vite's output references its assets directory.
            page="$(curl -fsS "http://127.0.0.1:$port/")"
            case "$page" in *'/assets/index-'*) ;; *) echo "linux/$arch: / does not serve the built web app" >&2; return 1 ;; esac
            # Client-side routes fall back to index.html.
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/some/client/route")" = 200
            # The version from the build argument, in the instance metadata.
            curl -fsS "http://127.0.0.1:$port/.well-known/osfm.json" | grep -Fq '"softwareVersion":"0.0.0-ci"'
            # It runs as the non-root user and keeps its database in the volume.
            test "$(docker inspect --format '{{.Config.User}}' "$name")" = 65532:65532
            files="$(docker cp "$name:/data/pb_data" - | tar -t)"
            printf '%s\n' "$files" | grep -qx 'pb_data/data.db'
            # The instance keys are generated in the volume on first start, readable by their owner only.
            listing="$(docker cp "$name:/data/secrets" - | tar -tv)"
            for key in master.key instance_ed25519; do
              if ! printf '%s\n' "$listing" | grep -Eq "^-rw------- .* secrets/$key\$"; then
                echo "linux/$arch: secrets/$key is missing or not mode 0600:" >&2
                printf '%s\n' "$listing" >&2
                docker logs "$name" >&2 || true
                return 1
              fi
            done
            docker rm -f "$name" >/dev/null
            docker volume rm "$name" >/dev/null
            echo "linux/$arch: the image serves the embedded web app."
          }
          check amd64 8090
          check arm64 8091
