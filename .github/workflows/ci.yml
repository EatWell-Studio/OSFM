name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      # The TypeScript types of the API (web/src/api/types.gen.ts) are what the Go types generate (tygo.yaml); and
      # the check does fail when they are not, after a change to a Go type that is not regenerated.
      - name: API types are up to date
        run: bin/check-api-types.sh
      - name: The API types check fails on stale types
        run: |
          sed -i 's/json:"geocoderEnabled"/json:"geocoderOn"/' internal/api/settings.go
          if bin/check-api-types.sh; then
            echo "check-api-types accepted types that do not match internal/api" >&2
            exit 1
          fi
          git checkout -- internal/api/settings.go web/src/api/types.gen.ts

      - name: Test
        run: go test -race ./...

  web:
    name: Web (format, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run check:i18n
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      # No URL of another origin in the built app (§4.7); and the check does fail on one, added to a copy of the build.
      - run: pnpm run check:urls
      - name: The URL check fails on an external URL
        run: |
          bad="$RUNNER_TEMP/bad-build"
          cp -R dist/app "$bad"
          echo 'import("https://cdn.example.com/lib.js")' >>"$(ls "$bad"/assets/index-*.js)"
          if node scripts/check-external-urls.ts "$bad"; then
            echo "check:urls accepted a build with an external URL" >&2
            exit 1
          fi

  binary:
    name: Binary (embedded web app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build the web app and the binary
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run build
          go build -o osfm ./cmd/osfm

      - name: Start the binary and check what it serves
        run: |
          data="$(mktemp -d)"
          ./osfm serve --dir "$data" --http 127.0.0.1:8090 >"$data/log.txt" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8090/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          set -e
          curl -fsS http://127.0.0.1:8090/api/health
          echo
          # The built app, not the placeholder page: Vite's output references its assets directory.
          curl -fsS http://127.0.0.1:8090/ | grep -q '/assets/index-'
          # Client-side routes fall back to index.html.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/some/client/route)" = 200
          # The PWA files: the manifest, the service worker and its registration script, the icons.
          curl -fsS http://127.0.0.1:8090/manifest.webmanifest | grep -q '"start_url":"/"'
          curl -fsS http://127.0.0.1:8090/sw.js | grep -q 'precacheAndRoute'
          curl -fsS http://127.0.0.1:8090/ | grep -q 'src="/registerSW.js"'
          for icon in pwa-192x192.png pwa-512x512.png maskable-icon-512x512.png apple-touch-icon-180x180.png; do
            curl -fsS -o /dev/null "http://127.0.0.1:8090/$icon"
          done
          # The map: its glyphs and sprites and MapLibre's worker as JavaScript (a module worker needs a script type).
          curl -fsS -o /dev/null 'http://127.0.0.1:8090/map/fonts/Noto%20Sans%20Regular/0-255.pbf'
          curl -fsS http://127.0.0.1:8090/map/sprites/light.json | grep -q '"width"'
          worker="$(cd web/dist/app && ls assets/maplibre-gl-worker-*.mjs)"
          curl -fsS -o /dev/null -w '%{content_type}' "http://127.0.0.1:8090/$worker" | grep -q '^text/javascript'
          # Without a session, the API and the tiles (the city index included) answer 401 (E1); writes to the API
          # without the X-OSFM header are refused too.
          for path in api/osfm/me tiles/ tiles/testcity.json; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8090/$path")" = 401
          done
          curl -s http://127.0.0.1:8090/api/osfm/me | grep -q '"status":401'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'X-OSFM: 1' http://127.0.0.1:8090/api/osfm/logout)" = 401
          # A fresh instance has no maintainer (G3): the setup wizard's status is public, and the setup code is in the
          # log and printed again by `osfm setup-code`.
          curl -fsS http://127.0.0.1:8090/api/osfm/setup | grep -q '"step":"maintainer"'
          code="$(./osfm setup-code --dir "$data" 2>/dev/null)"
          test -n "$code"
          grep -q "setup_code=$code" "$data/log.txt"
          # The instance metadata: public JSON with the instance key and the version the binary reports.
          ./osfm --version
          version="$(./osfm --version | sed 's/.* version //')"
          test "$(curl -s -o /dev/null -w '%{content_type}' http://127.0.0.1:8090/.well-known/osfm.json)" = application/json
          curl -fsS http://127.0.0.1:8090/.well-known/osfm.json | tee /dev/stderr | grep -Fq "\"softwareVersion\":\"$version\""
          curl -fsS http://127.0.0.1:8090/.well-known/osfm.json | grep -q '"publicKey":{"kty":"OKP","crv":"Ed25519","x":"[A-Za-z0-9_-]\{43\}"}'
          # Security headers on every response of the main listener (§4.7): pages, assets, API errors, 404s.
          asset="$(cd web/dist/app && ls assets/index-*.js)"
          for path in / /list "$asset" api/osfm/me api/collections/members/records assets/missing.js; do
            headers="$(curl -s -D - -o /dev/null -H 'Origin: https://elsewhere.example' "http://127.0.0.1:8090/${path#/}" | tr -d '\r')"
            for h in \
              "Content-Security-Policy: default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" \
              'Referrer-Policy: no-referrer' \
              'X-Content-Type-Options: nosniff' \
              'X-Frame-Options: DENY' \
              'Cross-Origin-Opener-Policy: same-origin' \
              'Cross-Origin-Resource-Policy: same-origin'; do
              printf '%s\n' "$headers" | grep -qiFx "$h" || { echo "$path lacks: $h" >&2; printf '%s\n' "$headers" >&2; exit 1; }
            done
            printf '%s\n' "$headers" | grep -qi '^Permissions-Policy: geolocation=(self),' || { echo "$path: Permissions-Policy" >&2; exit 1; }
            # No CORS on the main listener; no HSTS without an https OSFM_PUBLIC_URL.
            if printf '%s\n' "$headers" | grep -qiE '^(Access-Control-|Strict-Transport-Security)'; then
              echo "$path has CORS or HSTS headers:" >&2; printf '%s\n' "$headers" >&2; exit 1
            fi
          done
          # Content types and caching: hashed assets immutable; the page, the service worker and the manifest revalidated.
          ct() { curl -s -o /dev/null -w '%{content_type}' "http://127.0.0.1:8090/$1"; }
          cc() { curl -sI "http://127.0.0.1:8090/$1" | tr -d '\r' | sed -n 's/^[Cc]ache-[Cc]ontrol: //p'; }
          test "$(ct manifest.webmanifest)" = application/manifest+json
          test "$(ct "$asset")" = 'text/javascript; charset=utf-8'
          test "$(cc "$asset")" = 'public, max-age=31536000, immutable'
          for path in '' list index.html sw.js registerSW.js manifest.webmanifest; do
            test "$(cc "$path")" = no-cache || { echo "/$path: Cache-Control $(cc "$path")" >&2; exit 1; }
          done
          # Paths that look like files get 404, not the app's index.html; client-side routes still get it.
          for path in assets/missing.js map/ 'map/fonts/Noto%20Sans%20Regular/256-511.pbf' favicon.ico; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8090/$path")" = 404 || { echo "/$path is not 404" >&2; exit 1; }
          done
          for path in list me admin login register setup some/client/route; do
            curl -fsS "http://127.0.0.1:8090/$path" | grep -q '/assets/index-'
          done
          echo "The binary serves the embedded web app."

  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build the web app and the binary
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run build
          go build -o osfm ./cmd/osfm

      # Playwright's headless Chromium, cached by Playwright version; the system libraries it needs are installed on
      # every run (they are not in the cache).
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --dir web exec playwright --version | sed 's/^Version //')" >>"$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --dir web exec playwright install --with-deps --only-shell chromium

      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --dir web exec playwright install-deps chromium-headless-shell

      # The binary from an empty data directory, in a mobile viewport (web/e2e, docs/architecture.md §6).
      - name: End-to-end tests
        run: pnpm --dir web run e2e
        env:
          OSFM_E2E_BINARY: ${{ github.workspace }}/osfm
          OSFM_E2E_CHANNEL: bundled

      # Traces of every person's browser, screenshots of failed steps and the server log.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7

  docker:
    name: Docker (amd64, arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Compiling never needs emulation (deploy/Dockerfile cross-compiles); QEMU is for running the arm64 image below.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      # The same build as the release workflow, without pushing.
      - name: Build for both platforms
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          # A fixed version, so that the image reports something to check below (a release passes its tag).
          build-args: |
            VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker's image store cannot load a multi-platform build in one go; load each platform from the builder's cache.
      - name: Load the amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          build-args: |
            VERSION=0.0.0-ci
          tags: osfm:ci-amd64

      - name: Load the arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          load: true
          provenance: false
          build-args: |
            VERSION=0.0.0-ci
          tags: osfm:ci-arm64

      - name: Image sizes
        run: |
          for arch in amd64 arm64; do
            size="$(docker image inspect --format '{{.Size}}' "osfm:ci-$arch")"
            line="osfm:ci-$arch ($(docker image inspect --format '{{.Os}}/{{.Architecture}}' "osfm:ci-$arch")): $((size / 1024 / 1024)) MiB ($size bytes)"
            echo "$line"
            echo "- $line" >>"$GITHUB_STEP_SUMMARY"
          done

      - name: Run each image and check what it serves
        run: |
          set -eu
          check() {
            arch="$1" port="$2"
            name="osfm-ci-$arch"
            # A named volume, as in the README: it starts with the image's /data, owned by the non-root user.
            docker volume create "$name" >/dev/null
            docker run -d --name "$name" --platform "linux/$arch" -p "127.0.0.1:$port:8090" -v "$name:/data" "osfm:ci-$arch"
            # PocketBase starts slowly under emulation.
            ok=0
            for _ in $(seq 1 90); do
              if curl -fsS "http://127.0.0.1:$port/api/health" >/dev/null 2>&1; then ok=1; break; fi
              sleep 1
            done
            if [ "$ok" -ne 1 ]; then
              echo "linux/$arch: /api/health did not answer" >&2
              docker logs "$name" >&2 || true
              return 1
            fi
            curl -fsS "http://127.0.0.1:$port/api/health"
            echo
            # The built app, not the placeholder page: Vite's output references its assets directory.
            page="$(curl -fsS "http://127.0.0.1:$port/")"
            case "$page" in *'/assets/index-'*) ;; *) echo "linux/$arch: / does not serve the built web app" >&2; return 1 ;; esac
            # Client-side routes fall back to index.html.
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/some/client/route")" = 200
            # The version from the build argument, in the instance metadata.
            curl -fsS "http://127.0.0.1:$port/.well-known/osfm.json" | grep -Fq '"softwareVersion":"0.0.0-ci"'
            # It runs as the non-root user and keeps its database in the volume.
            test "$(docker inspect --format '{{.Config.User}}' "$name")" = 65532:65532
            files="$(docker cp "$name:/data/pb_data" - | tar -t)"
            printf '%s\n' "$files" | grep -qx 'pb_data/data.db'
            # The instance keys are generated in the volume on first start, readable by their owner only.
            listing="$(docker cp "$name:/data/secrets" - | tar -tv)"
            for key in master.key instance_ed25519; do
              if ! printf '%s\n' "$listing" | grep -Eq "^-rw------- .* secrets/$key\$"; then
                echo "linux/$arch: secrets/$key is missing or not mode 0600:" >&2
                printf '%s\n' "$listing" >&2
                docker logs "$name" >&2 || true
                return 1
              fi
            done
            docker rm -f "$name" >/dev/null
            docker volume rm "$name" >/dev/null
            echo "linux/$arch: the image serves the embedded web app."
          }
          check amd64 8090
          check arm64 8091
