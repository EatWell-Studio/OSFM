# Publishes a release when a version tag (v1.2.3, v1.2.3-rc.1, …) is pushed:
#   - the multi-arch container image ghcr.io/eatwell-studio/osfm (linux/amd64, linux/arm64), tagged with the version and,
#     for a release that is not a pre-release, also <major>.<minor>, <major> (from 1.0.0 on) and latest;
#   - the osfm binaries for Linux and macOS (amd64, arm64) with the web app embedded, and their SHA256SUMS, attached to a
#     GitHub Release for the tag.
# The image and every binary get a signed SLSA build provenance attestation (actions/attest), verifiable with
# `gh attestation verify`.
#
# The image build is the one the "Docker (amd64, arm64)" job in ci.yml runs on every pull request, plus the push; the
# binaries are built as in its "Binary (embedded web app)" job, cross-compiled.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/eatwell-studio/osfm

jobs:
  image:
    name: Image (amd64, arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # sign the attestation (Sigstore)
      attestations: write # store the attestation
      artifact-metadata: write # record where the attested image is stored
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Not needed for the build itself (it cross-compiles and the final stage runs nothing); kept as in CI so that a
      # RUN added to the final stage keeps working.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          # Pre-releases (a "-" in the version) get only their own tag; "latest" is set explicitly, never for them.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          # GitHub reports the licence as AGPL-3.0; the project is AGPL-3.0-or-later.
          labels: |
            org.opencontainers.image.title=OSFM
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          annotations: |
            org.opencontainers.image.title=OSFM
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      # No build cache: a release is built from scratch.
      - id: build
        name: Build and push for both platforms
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # The verifiable provenance is the GitHub attestation below; BuildKit's own would only add an
          # "unknown/unknown" entry to the image index.
          provenance: false
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Attest the image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  binaries:
    name: Binaries (linux, darwin × amd64, arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # sign the attestation (Sigstore)
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # No build or module cache: a release is built from scratch.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build the web app
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run build

      - name: Build the binaries
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}" arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" -o "dist/osfm-$os-$arch" ./cmd/osfm
          done
          (cd dist && sha256sum osfm-* >SHA256SUMS)
          cat dist/SHA256SUMS

      # The binary for the runner's own platform must serve the built web app, as in CI.
      - name: Check the linux/amd64 binary
        run: |
          data="$(mktemp -d)"
          dist/osfm-linux-amd64 serve --dir "$data" --http 127.0.0.1:8090 >"$data/log.txt" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8090/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8090/api/health
          echo
          page="$(curl -fsS http://127.0.0.1:8090/)"
          case "$page" in *'/assets/index-'*) ;; *) echo "/ does not serve the built web app" >&2; exit 1 ;; esac

      - name: Attest the binaries
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: [image, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist

      - name: Create the release with the binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            "${prerelease[@]}"
