version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only; move to TypeScript 7 when it does.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]

  # Base images of deploy/Dockerfile. The golang image must stay at least at the Go version in go.mod.
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      # Node.js follows CI (node-version in ci.yml); move both together.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
