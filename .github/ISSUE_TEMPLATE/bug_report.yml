name: Bug report
description: Something in OSFM does not work as expected.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        **Security issues must not be reported here** — see SECURITY.md.
        **Do not paste real member names, recommendations, invitation links or instance addresses** — describe them or use made-up examples.
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the map
        2. Add a recommendation
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Map display / tiles
        - Adding or editing places and recommendations
        - Search
        - Invitations, accounts, pseudonyms, visibility
        - Import / export
        - Deployment / self-hosting
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and device; for server issues the host (CPU architecture, OS) and how it is deployed.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this has not been reported yet.
          required: true
        - label: This report contains no real member data or instance addresses.
          required: true
